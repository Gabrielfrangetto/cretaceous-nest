<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cretaceous Nest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one incubator stage (egg in its nest, timer, progress) above a grid of hatched babies. */
:root {
  --bg: #eef0e3; --panel: #fbfcf5; --ink: #22301f; --muted: #636e59; --line: #d3d9c3;
  --accent: #b9790f; --accent-ink: #fffaf0; --nest: #9c7240; --nest2: #c49a5c; --glow: #f6d47a;
  --sky: #e2ecdc; --hill: #c9dbb9; --grass: #a8c17c; --grass2: #8eab63; --heart: #d2493f;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131913; --panel: #1b231b; --ink: #e5ebd8; --muted: #9ca78f; --line: #2d392c;
    --accent: #e2a83c; --accent-ink: #1b1406; --nest: #6f5130; --nest2: #8f6b3f; --glow: #8a6a1e; color-scheme: dark;
    --sky: #1c2828; --hill: #22332b; --grass: #2e4426; --grass2: #3a5530; --heart: #f06a5e;
  }
}
:root[data-theme="dark"] {
  --bg: #131913; --panel: #1b231b; --ink: #e5ebd8; --muted: #9ca78f; --line: #2d392c;
  --accent: #e2a83c; --accent-ink: #1b1406; --nest: #6f5130; --nest2: #8f6b3f; --glow: #8a6a1e; color-scheme: dark;
  --sky: #1c2828; --hill: #22332b; --grass: #2e4426; --grass2: #3a5530; --heart: #f06a5e;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 28px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(32px, 6vw, 46px); line-height: 1; letter-spacing: -.01em; }
h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.sync { margin: 0; font-size: 13px; color: var(--muted); }
.sub { margin: 6px 0 0; color: var(--muted); max-width: 58ch; }

.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: clamp(18px, 4vw, 32px); display: grid; gap: 22px; }

/* chooser */
.eggs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .eggs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.egg-card { display: grid; justify-items: center; gap: 4px; padding: 16px 10px 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); font: inherit; cursor: pointer; transition: border-color .15s, transform .15s; }
.egg-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.egg-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.egg-card svg { width: 64px; height: 83px; margin-bottom: 6px; }
.egg-card:hover svg { animation: wobble-once .5s ease-in-out; }
.egg-card strong { font-family: var(--display); font-weight: 600; font-size: 17px; }
.egg-card span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rarity { font-size: 11px !important; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }

/* incubator */
.incubator { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: center; }
@media (max-width: 640px) { .incubator { grid-template-columns: 1fr; } }
.nest-area { position: relative; display: grid; justify-items: center; padding-top: 10px; }
.egg-btn { position: relative; z-index: 2; width: min(190px, 52vw); aspect-ratio: 100 / 130; max-width: 100%; padding: 0; border: 0; background: none; cursor: pointer; transform-origin: 50% 92%; --amp: 1; animation: wobble 3s ease-in-out infinite; }
.egg-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; border-radius: 40%; }
.egg-btn svg { width: 100%; height: 100%; display: block; overflow: visible; }
.egg-btn.ready { animation-duration: 1.1s; }
.egg-btn.ready::before { content: ""; position: absolute; inset: -14% -18%; border-radius: 50%; background: radial-gradient(closest-side, var(--glow), transparent); z-index: -1; animation: pulse 1.6s ease-in-out infinite; }
.egg-btn.tap svg { animation: squish .18s ease-out; }
.egg-btn .top { transition: transform .7s cubic-bezier(.3,1.6,.5,1), opacity .7s .35s; transform-origin: 50% 50%; }
.egg-btn.open { animation: none; }
.egg-btn.open .top { transform: translate(-22px, -70px) rotate(-38deg); opacity: 0; }
.egg-btn.open .bottom { transition: opacity .5s .5s; opacity: 0; }
.nest { width: min(260px, 70vw); max-width: 100%; margin-top: -46px; position: relative; z-index: 3; pointer-events: none; }
.float { position: absolute; z-index: 4; font-family: var(--display); font-weight: 700; color: var(--accent); pointer-events: none; animation: rise .9s ease-out forwards; }
.baby-pop { position: absolute; z-index: 2; bottom: 64px; animation: pop .5s cubic-bezier(.3,1.7,.5,1) both; image-rendering: pixelated; }

.info { display: grid; gap: 14px; min-width: 0; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.timer { font-family: var(--display); font-weight: 600; font-size: clamp(40px, 9vw, 60px); line-height: 1; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 14px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; transition: width .3s linear; }
.bar b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--panel); opacity: .8; }
.stages { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.stages span.on { color: var(--ink); font-weight: 700; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font-family: var(--display); font-weight: 600; font-size: 17px; padding: 11px 22px; border-radius: 12px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:hover { filter: brightness(1.06); }
.btn:focus-visible, .ghost:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ghost { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.ghost.warn { border-color: var(--accent); color: var(--ink); }
.fact { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); font-size: 14px; color: var(--muted); max-width: 52ch; }
label { font-size: 13px; font-weight: 700; color: var(--muted); }
input[type="text"] { width: 100%; max-width: 320px; font: inherit; font-size: 18px; padding: 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }

/* collection */
.collection { display: grid; gap: 14px; }
.collection-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.babies { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.baby { display: grid; justify-items: center; gap: 2px; padding: 14px 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); text-align: center; min-width: 0; }
.baby canvas { image-rendering: pixelated; margin-bottom: 6px; }
.baby strong { font-family: var(--display); font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
.baby span { font-size: 12px; color: var(--muted); }
.empty { margin: 0; padding: 22px; border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: -12px; overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 18px; padding: 10px 16px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; color: var(--muted); cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 8px 8px 0 0; }
@media (max-width: 480px) { .tab { font-size: 15px; padding: 10px 10px; } }
.pill { font-family: var(--body); font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--heart); color: #fff; }
#panelNest { display: grid; gap: 22px; }

/* coins + shop */
.head-side { display: grid; justify-items: end; gap: 6px; }
@media (max-width: 640px) { .head-side { justify-items: start; } }
.coins { display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 3px 14px 3px 5px; font-family: var(--display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.coins svg { width: 26px; height: 26px; display: block; }
.coins.bump { animation: squish .3s ease-out; }
h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.25; }
#panelShop, #shopBox { display: grid; gap: 16px; }
.shop-item { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
@media (max-width: 600px) { .shop-item { grid-template-columns: 56px minmax(0, 1fr); } .shop-buy { grid-column: 1 / -1; } }
.shop-icon svg { width: 100%; height: auto; display: block; }
.shop-body { display: grid; gap: 4px; min-width: 0; }
.shop-buy { display: grid; gap: 6px; justify-items: end; }
@media (max-width: 600px) { .shop-buy { justify-items: start; } }
.rows-meter { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; max-width: 260px; margin-top: 6px; }
.rows-meter i { height: 9px; border-radius: 2px; background: var(--line); }
.rows-meter i.on { background: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.earn { padding: 4px 2px; }
.earn ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); }
.more-room { margin: 0; font-size: 14px; color: var(--muted); }
.more-room button { font: inherit; color: var(--accent); font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

/* inventory */
#panelInv { display: grid; gap: 14px; }
.inv-layout { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .inv-layout { grid-template-columns: minmax(0, 1fr); } }
.inv-main { display: grid; gap: 10px; min-width: 0; }
.inv-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.slot { position: relative; aspect-ratio: 1; min-width: 0; padding: 0; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; }
.slot:hover { border-color: var(--muted); }
.slot:focus-visible { outline: 3px solid var(--accent); outline-offset: 0; }
.slot svg { width: 68%; height: 68%; display: block; pointer-events: none; }
.slot .q { position: absolute; right: 2px; bottom: 0; font-size: clamp(9px, 1.7vw, 12px); font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; pointer-events: none; }
.slot.full .q { color: var(--accent); }
.slot.sel { outline: 3px solid var(--accent); outline-offset: -2px; background: var(--panel); }
.slot.over { background: color-mix(in srgb, var(--accent) 22%, var(--bg)); }
.drag-ghost { position: fixed; z-index: 1000; width: 44px; height: 44px; pointer-events: none; translate: -50% -50%; filter: drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
.drag-ghost svg { width: 100%; height: 100%; }
.inv-side { display: grid; gap: 10px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.inv-side .big { width: 64px; height: 64px; }
.inv-side .big svg { width: 100%; height: 100%; }
.inv-side p { margin: 0; }
.inv-side .qty { font-family: var(--display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }

/* nest scene */
.scene { position: relative; height: 300px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--sky); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.scene .decor { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene-empty { position: absolute; inset: auto 16px 40%; margin: 0; text-align: center; color: var(--muted); font-size: 15px; z-index: 1; }
.food-stock { margin-top: -10px; }
.walker { position: absolute; left: 0; display: grid; justify-items: center; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; cursor: pointer; will-change: transform; }
.walker canvas { display: block; image-rendering: pixelated; }
.walker img { display: block; pointer-events: none; }
img.baby-pop { image-rendering: auto; }
.baby img { margin-bottom: 6px; }
.walker:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 10px; }
.walker .nm { font-size: 11px; font-weight: 700; color: var(--ink); background: color-mix(in srgb, var(--panel) 75%, transparent); padding: 0 6px; border-radius: 6px; margin-top: 2px; white-space: nowrap; }
.bubble { position: absolute; bottom: calc(100% + 4px); left: 50%; translate: -50% 0; display: flex; align-items: center; gap: 4px; padding: 5px 8px; background: var(--panel); border: 2px solid var(--ink); border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; animation: beg 1s ease-in-out infinite; }
.bubble::after { content: ""; position: absolute; top: 100%; left: 50%; translate: -50% 0; border: 6px solid transparent; border-top-color: var(--ink); }
.bubble svg { width: 20px; height: 20px; display: block; }
.heart { position: absolute; z-index: 300; font-size: 22px; color: var(--heart); font-weight: 700; pointer-events: none; animation: rise 1s ease-out forwards; }
.say { position: absolute; z-index: 300; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--panel); padding: 2px 8px; border-radius: 8px; pointer-events: none; white-space: nowrap; animation: rise 1.2s ease-out forwards; }
.baby .fed { color: var(--accent); font-weight: 700; }
.baby .fed.hungry { color: var(--heart); }

@keyframes beg { 50% { translate: -50% -4px; } }
@keyframes wobble { 0%, 68%, 100% { transform: rotate(0); } 74% { transform: rotate(calc(var(--amp) * -1deg)); } 82% { transform: rotate(calc(var(--amp) * 1deg)); } 90% { transform: rotate(calc(var(--amp) * -.5deg)); } }
@keyframes wobble-once { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes squish { 50% { transform: scale(1.06, .94); } }
@keyframes pulse { 50% { opacity: .55; transform: scale(1.06); } }
@keyframes rise { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-46px); } }
@keyframes pop { from { transform: translateY(30px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .egg-btn, .egg-btn.ready::before, .egg-card:hover svg, .egg-btn.tap svg, .bubble { animation: none !important; }
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>Cretaceous Nest</h1>
      <p class="sub">Pick an egg and wait for it to hatch. Time keeps running even when the page is closed.</p>
    </div>
    <div class="head-side">
      <p class="coins" aria-label="Coins"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#e9b83a" stroke="#a87812"/><path d="M8 12.2 C6.6 12.2 6.2 10.8 6.9 9.6 L5.2 6.3 M8 9.2 L8 4.4 M9.1 9.6 L10.8 6.3" stroke="#7d5408" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg><b id="coinsVal">0</b></p>
      <p class="sync" id="sync">Progress saved in this browser</p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Game sections">
    <button class="tab" role="tab" id="tabInc" aria-controls="panelInc" type="button">Incubator</button>
    <button class="tab" role="tab" id="tabNest" aria-controls="panelNest" type="button">Nest <span class="pill" id="hungryPill" hidden></span></button>
    <button class="tab" role="tab" id="tabInv" aria-controls="panelInv" type="button">Inventory</button>
    <button class="tab" role="tab" id="tabShop" aria-controls="panelShop" type="button">Shop</button>
  </nav>

  <div id="panelInc" role="tabpanel" aria-labelledby="tabInc">
    <section class="stage" id="stage" aria-live="polite"></section>
  </div>

  <div id="panelNest" role="tabpanel" aria-labelledby="tabNest" hidden>
    <div class="scene" id="scene">
      <svg class="decor" viewBox="0 0 800 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <ellipse cx="160" cy="180" rx="260" ry="70" fill="var(--hill)"/>
        <ellipse cx="620" cy="185" rx="300" ry="80" fill="var(--hill)"/>
        <rect x="0" y="165" width="800" height="135" fill="var(--grass)"/>
        <path d="M0 165 Q200 150 400 165 T800 162 L800 175 L0 175 Z" fill="var(--grass2)"/>
        <g fill="var(--grass2)">
          <path d="M60 240 l6 -22 l4 22 Z M70 240 l8 -28 l3 28 Z M82 240 l5 -18 l4 18 Z"/>
          <path d="M520 280 l6 -22 l4 22 Z M531 280 l8 -30 l3 30 Z M543 280 l5 -18 l4 18 Z"/>
          <path d="M330 205 l5 -16 l3 16 Z M339 205 l6 -20 l3 20 Z"/>
          <path d="M720 225 l6 -20 l4 20 Z M730 225 l7 -26 l3 26 Z"/>
        </g>
        <g fill="none" stroke="var(--grass2)" stroke-width="5" stroke-linecap="round">
          <path d="M760 170 Q752 120 790 90"/><path d="M766 150 Q790 140 800 150"/><path d="M760 130 Q735 115 728 92"/>
          <path d="M28 172 Q36 128 8 100"/><path d="M30 150 Q8 140 0 146"/>
        </g>
        <ellipse cx="660" cy="262" rx="70" ry="16" fill="var(--nest)"/>
        <ellipse cx="660" cy="256" rx="56" ry="9" fill="var(--nest2)"/>
      </svg>
      <p class="scene-empty" id="sceneEmpty">No babies yet. Hatch an egg in the Incubator tab.</p>
    </div>
    <p class="hint food-stock" id="foodStock"></p>

    <section class="collection">
      <div class="collection-head">
        <h2>Your babies</h2>
        <span class="count" id="count"></span>
      </div>
      <div id="babies"></div>
    </section>
  </div>

  <div id="panelInv" role="tabpanel" aria-labelledby="tabInv" hidden>
    <div class="collection-head">
      <h2>Inventory</h2>
      <div class="row">
        <span class="count" id="invCount"></span>
        <button class="ghost" id="invSort" type="button">Sort</button>
      </div>
    </div>
    <div class="inv-layout">
      <div class="inv-main">
        <div class="inv-grid" id="invGrid" role="grid" aria-label="Inventory"></div>
        <p class="more-room" id="moreRoom"></p>
      </div>
      <aside class="inv-side" id="invSide" aria-live="polite"></aside>
    </div>
  </div>

  <div id="panelShop" role="tabpanel" aria-labelledby="tabShop" hidden>
    <h2>Shop</h2>
    <div id="shopBox"></div>
  </div>
</main>

<script>
(() => {
  // ---------- data ----------
  const SPECIES = {
    proto:  { egg: 'Spotted Egg',  species: 'Protoceratops', mins: 1,  rarity: 'Common',    shell: '#eadcbf', mark: '#8b6a44', pattern: 'spots',
              body: '#c79d63', acc: '#d9662f', nick: 'Popcorn', fact: 'Fossil embryos suggest Protoceratops eggs took about 83 days to hatch.' },
    hypa:   { egg: 'Striped Egg',  species: 'Hypacrosaurus', mins: 5,  rarity: 'Uncommon',  shell: '#d6e2cc', mark: '#5c7b4f', pattern: 'stripes',
              body: '#78a463', acc: '#d8bd3e', nick: 'Sprout',  fact: 'Teeth from Hypacrosaurus embryos suggest almost 6 months inside the egg.' },
    raptor: { egg: 'Speckled Egg', species: 'Velociraptor',  mins: 15, rarity: 'Rare',      shell: '#cfd6e4', mark: '#46557a', pattern: 'speckle',
              body: '#6a7ca8', acc: '#e3ae45', nick: 'Sparky',  fact: 'An adult Velociraptor was about 2 m long including the tail, and its body was covered in feathers.' },
    rex:    { egg: 'Golden Egg',   species: 'Tyrannosaurus', mins: 60, rarity: 'Legendary', shell: '#f0cd68', mark: '#b48114', pattern: 'gold',
              body: '#a35b40', acc: '#f0cd68', nick: 'Rex',     fact: 'A newly hatched tyrannosaur is estimated to have been about 90 cm long.' },
  };
  const ORDER = ['proto', 'hypa', 'raptor', 'rex'];
  const TAP_MS = 1000;            // each tap warms the egg by 1 s
  const TAP_CAP = 0.5;            // taps can cut at most half of the time

  // ---------- state + storage ----------
  const LS = 'cretaceous-nest';
  const LEGACY_LS = 'ninho-cretaceo';   // saves from the Portuguese version
  let S = { v: 1, current: null, hatched: [], updatedAt: 0 };
  try {

  } catch (e) {}
  let ref = null, saveTimer = null, writing = false, again = false;
  const clone = o => JSON.parse(JSON.stringify(o));

  function touch() { S.updatedAt = Date.now(); persistLocal(); scheduleSave(); }
  function scheduleSave(delay = 1200) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, delay); }
  async function flush() {
    if (!ref) return;
    if (writing) { again = true; return; }
    writing = true;
    try { await ref.set(clone(S)); syncEl.textContent = 'Progress saved to your account'; }
    catch (e) { syncEl.textContent = 'Progress saved in this browser'; }

  // cloud save only exists when the page runs as a claude.ai artifact; elsewhere localStorage is the save
  async function connect() {
    if (!window.claude || !window.claude.use) return;

      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      ref = db.doc('data/users/' + uid + '/save');
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && Array.isArray(remote.hatched) && (remote.updatedAt || 0) >= S.updatedAt) {
        S = clone(remote); normalizeState(); sel = -1; persistLocal(); render();
        if (tab === 'inv') renderInv();
        if (tab === 'shop') renderShop();
        syncEl.textContent = 'Progress saved to your account';
      } else if (S.updatedAt) {
        flush();
      } else {
        syncEl.textContent = 'Progress saved to your account';
      }

  }

  // ---------- egg art ----------
  let uid = 0;
  const EGG = 'M50 4 C78 4 96 52 96 80 C96 108 76 126 50 126 C24 126 4 108 4 80 C4 52 22 4 50 4 Z';
  const ZIG = '0,0 100,0 100,62 88,56 76,66 64,55 52,67 40,56 28,66 16,55 0,63';
  const CRACKS = [
    'M60 18 L55 30 L62 38 L56 50',
    'M28 52 L38 58 L33 68 L44 74 L40 84',
    'M74 60 L66 70 L75 80 L68 92 M55 50 L48 58',
  ];
  function patternSVG(sp) {
    const m = sp.mark;
    if (sp.pattern === 'spots') return [[30,40,9],[62,30,6],[70,70,11],[36,88,7],[54,104,8],[22,70,5],[80,96,6]]
      .map(([x,y,r]) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.8}" fill="${m}" opacity=".75"/>`).join('');
    if (sp.pattern === 'stripes') return [34, 62, 92]
      .map(y => `<path d="M0 ${y} Q25 ${y-8} 50 ${y} T100 ${y}" stroke="${m}" stroke-width="7" fill="none" opacity=".7"/>`).join('');
    if (sp.pattern === 'speckle') {
      let s = 11, out = '';
      for (let i = 0; i < 46; i++) { s = (s * 9301 + 49297) % 233280; const x = s / 233280 * 100; s = (s * 9301 + 49297) % 233280; const y = 8 + s / 233280 * 118;
        out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.2 + (i % 3)).toFixed(1)}" fill="${m}" opacity=".8"/>`; }
      return out;
    }
    return `<path d="M-10 70 L70 -10 L84 4 L4 84 Z" fill="#fff6d0" opacity=".45"/>
            <path d="M30 100 l3 -7 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 Z" fill="#fff6d0" opacity=".9"/>
            <path d="M72 44 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 Z" fill="#fff6d0" opacity=".9"/>
            <ellipse cx="50" cy="110" rx="40" ry="14" fill="${m}" opacity=".35"/>`;
  }
  function eggSVG(sp, crack = 0, split = false) {
    const id = 'e' + (++uid);
    const shell = `<path d="${EGG}" fill="${sp.shell}"/>
      <g clip-path="url(#${id}c)">${patternSVG(sp)}
        <ellipse cx="34" cy="38" rx="11" ry="18" fill="#fff" opacity=".35" transform="rotate(20 34 38)"/>
        <path d="M0 96 Q50 140 100 96 L100 130 L0 130 Z" fill="#000" opacity=".08"/></g>
      <path d="${EGG}" fill="none" stroke="${sp.mark}" stroke-width="2.5" opacity=".7"/>
      ${CRACKS.slice(0, crack).map(d => `<path d="${d}" fill="none" stroke="#2b2416" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`).join('')}`;
    const defs = `<defs><clipPath id="${id}c"><path d="${EGG}"/></clipPath>
      <clipPath id="${id}t"><polygon points="${ZIG}"/></clipPath>
      <clipPath id="${id}b"><polygon points="0,63 16,55 28,66 40,56 52,67 64,55 76,66 88,56 100,62 100,130 0,130"/></clipPath></defs>`;
    const body = split
      ? `<g class="bottom" clip-path="url(#${id}b)">${shell}</g><g class="top" clip-path="url(#${id}t)">${shell}</g>`

    return `<svg viewBox="0 0 100 130" aria-hidden="true">${defs}${body}</svg>`;
  }
  const NEST = `<svg class="nest" viewBox="0 0 260 80" aria-hidden="true">
    <ellipse cx="130" cy="44" rx="124" ry="30" fill="var(--nest)"/>
    <ellipse cx="130" cy="34" rx="104" ry="18" fill="var(--nest2)"/>
    <g stroke="var(--nest)" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M20 40 Q70 22 120 44"/><path d="M60 52 Q120 30 190 50"/><path d="M140 40 Q190 24 240 42"/>
      <path d="M40 58 Q110 70 170 56"/><path d="M110 62 Q180 74 230 52"/>
    </g>
    <g stroke="var(--nest2)" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M12 46 Q60 66 104 58"/><path d="M150 64 Q200 60 248 44"/><path d="M80 44 Q130 56 176 42"/>
    </g></svg>`;

  // ---------- baby art ----------
  // pixel-art fallback, used when a species has no sprite image or the image fails to load
  const BASE = [
    "................", "..........####..", ".........######.", ".........##o####", ".........#######",
    "........#####...", "..#....######...", "..##..#######...", "...##########...", "....#########...",
    ".....#######....", "......##.##.....", "......#..#......", "......##.##.....",
  ];
  const EXTRA = {
    proto:  [[0,9],[1,8],[1,9],[2,8],[3,8],[4,8]],
    hypa:   [[0,10],[0,11],[0,12],[1,9],[7,8],[8,6],[9,10]],
    raptor: [[0,11],[0,13],[6,2],[7,2],[8,3],[1,9]],
    rex:    [[5,8],[7,7],[8,5],[9,9]],
  };
  // males only: extra feathers, horns, crests and stripes in a second, brighter color ('b')
  const MALE_EXTRA = {
    proto:  [[1,8],[3,8],[2,15],[8,7],[8,9],[0,8]],
    hypa:   [[0,11],[0,13],[7,3],[8,4],[9,6],[1,8]],
    raptor: [[0,12],[0,10],[5,8],[5,2],[6,1],[6,13],[7,13]],
    rex:    [[0,11],[0,12],[6,9],[9,6],[1,9]],
  };
  const MALE_COLOR = { proto: '#f2cf45', hypa: '#d9503a', raptor: '#36b5a5', rex: '#f08a46' };
  const SEX = { m: { word: 'Male', sym: '♂' }, f: { word: 'Female', sym: '♀' } };
  function hashId(id) { let s = 0; for (const ch of String(id)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return s; }
  // babies from before sexes existed get a stable one from their id
  const sexOf = h => h.sex === 'm' || h.sex === 'f' ? h.sex : (hashId(h.id) % 2 ? 'm' : 'f');

  function babyGrid(type, sex) {
    const g = BASE.map(r => r.split(''));
    for (const [r, c] of EXTRA[type]) g[r][c] = 'a';
    if (type === 'rex') { g[6][13] = '#'; g[7][13] = '#'; }
    if (sex === 'm') for (const [r, c] of MALE_EXTRA[type]) g[r][c] = 'b';
    return g;
  }
  const SPRITES = {
    proto:  { m: 'sprites/proto-m.png',  f: 'sprites/proto-f.png' },
    hypa:   { m: 'sprites/hypa-m.png',   f: 'sprites/hypa-f.png' },
    raptor: { m: 'sprites/raptor-m.png', f: 'sprites/raptor-f.png' },
    rex:    { m: 'sprites/rex-m.png',    f: 'sprites/rex-f.png' },
  };
  const babyLabel = (type, sex) => SEX[sex].word + ' ' + SPECIES[type].species + ' baby';
  function babyArt(type, px, sex = 'f', pixelOnly = false) {
    const src = !pixelOnly && SPRITES[type] && SPRITES[type][sex];
    if (src) {
      const img = new Image();
      img.src = src;
      img.alt = babyLabel(type, sex);
      img.draggable = false;
      img.style.height = Math.round(px * 17) + 'px';
      img.style.width = 'auto';
      img.addEventListener('error', () => {
        const c = babyArt(type, px, sex, true);
        c.className = img.className; c.style.transform = img.style.transform;
        img.replaceWith(c);
      });
      return img;
    }
    const sp = SPECIES[type], g = babyGrid(type, sex);
    const male = sex === 'm';
    const cv = document.createElement('canvas');
    cv.width = 16 * px; cv.height = 14 * px;
    const ctx = cv.getContext('2d');
    for (let r = 0; r < g.length; r++) for (let c = 0; c < 16; c++) {
      const ch = g[r][c];
      if (ch === '.') continue;
      // females keep one base color; males show the accent and the extra color
      ctx.fillStyle = ch === 'o' ? '#1b1a17' : !male ? sp.body : ch === 'a' ? sp.acc : ch === 'b' ? MALE_COLOR[type] : sp.body;

  }

  // ---------- helpers ----------
  function fmt(ms) {
    const t = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
    const p = n => String(n).padStart(2, '0');
    return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
  }
  const minsLabel = m => m >= 60 ? (m / 60) + ' h' : m + ' min';
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
  function progress() {
    const c = S.current;
    const dur = c.duration, elapsed = Date.now() - c.startedAt + (c.bonus || 0);
    return { frac: Math.min(1, elapsed / dur), left: Math.max(0, dur - elapsed) };
  }
  const crackStage = f => f >= .75 ? 3 : f >= .5 ? 2 : f >= .25 ? 1 : 0;
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  // ---------- render ----------
  const stage = document.getElementById('stage');
  let reveal = null;        // the fresh hatchling while it is being named
  let shownStage = -1, tick = null;

  function render() {
    clearInterval(tick); tick = null; shownStage = -1;
    renderCoins();
    if (reveal) renderReveal();
    else if (S.current) renderIncubator();
    else renderChooser();
    renderBabies();
  }

  function renderChooser() {
    stage.innerHTML = `
      <div><h2>Pick an egg to hatch</h2>
      <p class="sub">Every egg hides a species. The rarer the egg, the longer it takes to hatch.</p></div>
      <div class="eggs">${ORDER.map(k => {
        const sp = SPECIES[k];
        return `<button class="egg-card" type="button" data-k="${k}">

      const sp = SPECIES[b.dataset.k];

  }

  function renderIncubator() {
    const sp = SPECIES[S.current.type];
    stage.innerHTML = `
      <div class="incubator">
        <div class="nest-area" id="nestArea">
          <button class="egg-btn" id="egg" type="button" aria-label="Warm the egg"></button>
          ${NEST}

          <p class="eyebrow">${sp.egg} · ${sp.rarity}</p>

  let confirmGiveUp = false, giveUpTimer = null;
  function renderActions() {
    const a = document.getElementById('actions');
    if (!a) return;
    const ready = progress().frac >= 1;
    a.innerHTML = ready
      ? `<button class="btn" id="hatch" type="button">Hatch!</button>`
      : `<button class="ghost ${confirmGiveUp ? 'warn' : ''}" id="giveup" type="button">${confirmGiveUp ? 'Tap again to throw this egg away' : 'Change egg'}</button>`;

  }

  function update() {
    if (!S.current) return;
    const { frac, left } = progress();
    const ready = frac >= 1;
    document.getElementById('timer').textContent = ready ? 'Ready!' : fmt(left);
    document.getElementById('fill').style.width = (frac * 100).toFixed(2) + '%';
    const idx = ready ? 4 : Math.min(3, Math.floor(frac * 4));
    document.querySelectorAll('#stages span').forEach((s, i) => s.classList.toggle('on', i === idx));
    const egg = document.getElementById('egg');
    egg.style.setProperty('--amp', (1 + frac * 7).toFixed(2));
    egg.style.animationDuration = ready ? '1.1s' : (3 - frac * 1.6).toFixed(2) + 's';

  function onEggTap(e) {
    const egg = e.currentTarget;
    if (progress().frac >= 1) { hatch(); return; }
    const c = S.current;
    const before = c.bonus || 0;
    c.bonus = Math.min(c.duration * TAP_CAP, before + TAP_MS);
    egg.classList.remove('tap'); void egg.offsetWidth; egg.classList.add('tap');
    const area = document.getElementById('nestArea');
    const f = document.createElement('span');
    f.className = 'float';
    f.textContent = c.bonus > before ? '+1 s' : 'Already toasty';
    const r = area.getBoundingClientRect();
    f.style.left = ((e.clientX || r.left + r.width / 2) - r.left - 14) + 'px';
    f.style.top = ((e.clientY || r.top + 60) - r.top - 20) + 'px';
    area.appendChild(f);
    setTimeout(() => f.remove(), 900);
    if (c.bonus > before) { touch(); update(); }
  }

  function hatch() {
    if (!S.current || reveal) return;
    const type = S.current.type;
    clearInterval(tick); tick = null;
    const egg = document.getElementById('egg');
    egg.classList.remove('ready');
    egg.innerHTML = eggSVG(SPECIES[type], 3, true);
    egg.disabled = true;

    if (actions) actions.innerHTML = '';

    const area = document.getElementById('nestArea');
    const sex = Math.random() < 0.5 ? 'm' : 'f';
    const baby = babyArt(type, 7, sex);
    baby.className = 'baby-pop';
    setTimeout(() => area.appendChild(baby), 350);
    // the baby is saved right away with a default name, so closing the page now loses nothing
    const sp = SPECIES[type];
    const count = S.hatched.filter(h => h.type === type).length;
    const suggestion = count ? sp.nick + ' ' + (count + 1) : sp.nick;
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    S.hatched.unshift({ id, type, sex, name: suggestion, at: Date.now() });
    const lootId = type === 'rex' ? 'golden_shell' : 'shell';
    const lost = addItem(lootId, 1, false);

    S.current = null; touch();
    setTimeout(() => { reveal = { type, id, sex, suggestion, loot }; render(); }, 1500);
  }

  function renderReveal() {
    const sp = SPECIES[reveal.type];
    const suggestion = reveal.suggestion;
    stage.innerHTML = `
      <div class="incubator">
        <div class="nest-area" id="nestArea">${NEST}</div>
        <div class="info">
          <p class="eyebrow">It's a ${reveal.sex === 'm' ? 'boy' : 'girl'}! A ${SEX[reveal.sex].word.toLowerCase()} ${sp.species} ${SEX[reveal.sex].sym}</p>
          <h2>Name your baby</h2>
          <p class="fact">${esc(sp.fact)}</p>
          <p class="hint">${reveal.sex === 'm' ? 'Males have bright colors and extra feathers, crests or stripes.' : 'Females have a single base color and no decorations.'} ${esc(reveal.loot || '')}</p>
          <form class="info" id="nameForm">

    const area = document.getElementById('nestArea');

  function renderBabies() {
    const box = document.getElementById('babies');

    for (const h of S.hatched) {
      const sp = SPECIES[h.type];

      card.className = 'baby';
      const sx = SEX[sexOf(h)];

  // ---------- hunger ----------
  const FOOD = {
    leaf: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 C3 6 8 2 14 2 C14 8 10 13 3 13Z" fill="#6fa64a"/><path d="M3 13 L10 6" stroke="#3f6b2a" stroke-width="1.4"/></svg>',
    meat: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2 C13 2 15 5 14 8 C13 11 9 12 7 10 C5 8 6 2 9 2Z" fill="#c4553b"/><path d="M9.5 4 C11 4 12 5 12 7" stroke="#eb9a84" stroke-width="1.3" fill="none"/><path d="M7.5 9.5 L4 13" stroke="#f2ead8" stroke-width="2.4" stroke-linecap="round"/><circle cx="3" cy="13.6" r="1.5" fill="#f2ead8"/><circle cx="2.4" cy="12" r="1.4" fill="#f2ead8"/></svg>',
  };
  // which inventory item each species eats; every meal uses 1
  const DIET = { proto: 'leaf', hypa: 'leaf', raptor: 'meat', rex: 'meat' };
  const ASK = { leaf: 'Wants leaves', meat: 'Wants meat' };
  const RAN_OUT = { leaf: 'Out of leaves!', meat: 'Out of meat!' };
  // each baby gets its own rhythm, between 1.5 and 4 minutes
  const hungerEvery = h => (90 + hashId(h.id) % 150) * 1000;
  const isHungry = h => Date.now() - (h.lastFed || h.at) >= hungerEvery(h);
  const findBaby = id => S.hatched.find(h => h.id === id);

  function checkHunger() {
    let n = 0;
    for (const h of S.hatched) {
      const hungry = isHungry(h);
      if (hungry) n++;
      const w = walkers.get(h.id);
      if (w && w.hungry !== hungry) {
        w.hungry = hungry;
        w.bubble.hidden = !hungry;
        w.el.setAttribute('aria-label', h.name + (hungry ? ', hungry. Tap to feed.' : ', full.'));
      }
      const fed = document.querySelector(`.fed[data-id="${h.id}"]`);
      if (fed) {
        fed.textContent = hungry ? 'Hungry!' : 'Ate ' + plural(h.fed || 0, 'time', 'times');
        fed.classList.toggle('hungry', hungry);
      }
    }
    // hungry babies say so when the food they need has run out
    const stock = { leaf: countItem('leaf'), meat: countItem('meat') };
    for (const w of walkers.values()) {
      if (!w.hungry) continue;
      const h = findBaby(w.id); if (!h) continue;
      const food = DIET[h.type];
      const label = stock[food] ? ASK[food] : RAN_OUT[food];
      const t = w.bubble.querySelector('span');
      if (t.textContent !== label) t.textContent = label;
    }
    const fs = document.getElementById('foodStock');
    const fsText = `In your inventory: ${plural(stock.leaf, 'leaf', 'leaves')} and ${stock.meat} meat. Each meal uses 1.`;
    if (fs.textContent !== fsText) fs.textContent = fsText;
    const pill = document.getElementById('hungryPill');
    pill.hidden = n === 0;
    pill.textContent = n + ' hungry';
  }

  // ---------- walking babies ----------
  const scene = document.getElementById('scene');
  const walkers = new Map();
  const sceneW = () => scene.clientWidth || 600;

  function syncWalkers() {
    const ids = new Set(S.hatched.map(h => h.id));
    for (const [id, w] of walkers) if (!ids.has(id)) { w.el.remove(); walkers.delete(id); }
    for (const h of S.hatched) {
      if (!SPECIES[h.type]) continue;
      const have = walkers.get(h.id);
      if (have) { have.name.textContent = h.name + ' ' + SEX[sexOf(h)].sym; continue; }
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'walker';
      const bubble = document.createElement('span');
      bubble.className = 'bubble'; bubble.hidden = true;
      const food = DIET[h.type];
      bubble.innerHTML = FOOD[food] + '<span>' + ASK[food] + '</span>';
      const cv = babyArt(h.type, 4, sexOf(h));
      const name = document.createElement('span'); name.className = 'nm'; name.textContent = h.name + ' ' + SEX[sexOf(h)].sym;
      el.append(bubble, cv, name);
      const depth = Math.random();
      el.style.bottom = Math.round(12 + depth * 60) + 'px';
      el.style.zIndex = String(200 - Math.round(depth * 100));
      const w = { id: h.id, el, cv, bubble, name, hungry: null, x: Math.random() * (sceneW() - 70), dir: Math.random() < .5 ? 1 : -1,
                  speed: 28 + Math.random() * 26, pause: Math.random() * 1.5, walk: 1 + Math.random() * 3, t: Math.random() * 6, hop: 0 };
      el.addEventListener('click', () => feed(w));
      scene.appendChild(el);
      walkers.set(h.id, w);
    }
    document.getElementById('sceneEmpty').hidden = walkers.size > 0;
  }

  function popText(w, cls, text) {
    const p = document.createElement('span');
    p.className = cls; p.textContent = text;
    p.style.left = (w.x + 22) + 'px';
    p.style.bottom = (parseInt(w.el.style.bottom, 10) + 70) + 'px';
    scene.appendChild(p);
    setTimeout(() => p.remove(), 1200);
  }

  function feed(w) {
    const h = findBaby(w.id);
    if (!h) return;
    if (isHungry(h)) {
      const food = DIET[h.type];
      if (countItem(food) < 1) {
        popText(w, 'say', 'No ' + ITEMS[food].plural + ' in your inventory');
        return;
      }
      removeItem(food, 1);
      w.hop = 0.45;
      h.lastFed = Date.now();
      h.fed = (h.fed || 0) + 1;
      addCoins(FEED_COINS);
      touch();
      popText(w, 'heart', '♥ +' + FEED_COINS);
      checkHunger();
    } else {
      w.hop = 0.45;
      popText(w, 'say', "I'm full");
    }
  }

  let raf = null, lastT = 0;
  function step(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;
    const sw = sceneW();
    for (const w of walkers.values()) {
      const maxX = sw - (w.el.offsetWidth || 70) - 4;
      let moving = false;
      if (w.pause > 0) w.pause -= dt;
      else {
        moving = true;
        w.x += w.dir * w.speed * (w.hungry ? 0.45 : 1) * dt;
        w.walk -= dt; w.t += dt * 12;
        if (w.x < 4) { w.x = 4; w.dir = 1; }
        if (w.x > maxX) { w.x = maxX; w.dir = -1; }
        if (w.walk <= 0) { w.pause = 0.6 + Math.random() * 2.4; w.walk = 1.5 + Math.random() * 4; if (Math.random() < .45) w.dir *= -1; }
      }
      let lift = moving ? Math.abs(Math.sin(w.t)) * 3 : 0;
      if (w.hop > 0) { w.hop -= dt; lift += Math.sin(Math.PI * (1 - Math.max(0, w.hop) / 0.45)) * 16; }
      w.el.style.transform = `translate(${w.x.toFixed(1)}px, ${(-lift).toFixed(1)}px)`;
      w.cv.style.transform = `scaleX(${w.dir})`;
    }
    raf = requestAnimationFrame(step);
  }
  function runScene(on) {
    if (on && !raf) { lastT = performance.now(); raf = requestAnimationFrame(step); }
    if (!on && raf) { cancelAnimationFrame(raf); raf = null; }
  }

  // ---------- inventory ----------
  const SLOTS = 100, BASE_SLOTS = 10, ROW = 10, MAX_STACK = 99;
  const SHELL_PATH = 'M2 8 L4.5 6 L6.5 8.5 L8.5 5.5 L10.5 8.5 L12 6.5 L14 8 C14 12.5 11.5 15 8 15 C4.5 15 2 12.5 2 8Z';
  const ITEMS = {
    leaf:         { name: 'Leaf', plural: 'leaves', icon: FOOD.leaf, desc: 'Food for Protoceratops and Hypacrosaurus. Each meal uses 1 leaf.' },
    meat:         { name: 'Meat', plural: 'meat', icon: FOOD.meat, desc: 'Food for Velociraptor and Tyrannosaurus. Each meal uses 1 meat.' },
    shell:        { name: 'Eggshell', plural: 'eggshells', desc: 'Left over from an egg that hatched in the nest.',
                    icon: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${SHELL_PATH}" fill="#eadcbf" stroke="#8b6a44" stroke-width="1"/><ellipse cx="5.5" cy="11" rx="1.2" ry="1" fill="#8b6a44" opacity=".6"/></svg>` },
    golden_shell: { name: 'Golden eggshell', plural: 'golden eggshells', desc: 'A piece of the rare Golden Egg, where the Tyrannosaurus hatches from.',
                    icon: `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="${SHELL_PATH}" fill="#f0cd68" stroke="#b48114" stroke-width="1"/><path d="M5 10.5 l.8 -1.6 l.8 1.6 l1.6 .8 l-1.6 .8 l-.8 1.6 l-.8 -1.6 l-1.6 -.8Z" fill="#fff6d0"/></svg>` },
    amber:        { name: 'Amber', plural: 'amber', desc: 'Fossilized tree resin. Some pieces hold insects from the Cretaceous.',
                    icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 L14 6 L11.5 14.5 L4.5 14.5 L2 6Z" fill="#e39a2c" stroke="#a5620f" stroke-width="1"/><path d="M5 6 L8 3.5 L10.5 6" stroke="#ffd58a" stroke-width="1" fill="none"/><ellipse cx="8" cy="10" rx="1.4" ry="1" fill="#6b3f0c"/><path d="M6.6 9.4 L5.6 8.8 M9.4 9.4 L10.4 8.8" stroke="#6b3f0c" stroke-width=".7"/></svg>' },
  };
  // item ids used by the Portuguese version, mapped so older saves keep their items
  const LEGACY_ITEM = { samambaia: 'leaf', carne: 'meat', casca: 'shell', casca_dourada: 'golden_shell', ambar: 'amber' };
  const STARTER = [['leaf', 20], ['meat', 12], ['amber', 1]];

  function normalizeState() {
    if (typeof S.coins !== 'number') S.coins = 0;
    if (!(Array.isArray(S.inv) && S.inv.length === SLOTS)) {
      S.inv = Array(SLOTS).fill(null);
      S.invSize = BASE_SLOTS;
      for (const [id, n] of STARTER) addItem(id, n, false);
    }
    S.inv = S.inv.map(s => {
      if (!s) return null;
      const id = LEGACY_ITEM[s.id] || s.id;
      return ITEMS[id] && s.n > 0 ? { id, n: Math.min(MAX_STACK, Math.floor(s.n)) } : null;
    });
    S.invSize = Math.min(SLOTS, Math.max(BASE_SLOTS, Math.floor((S.invSize || BASE_SLOTS) / ROW) * ROW));
    // older saves had all 100 slots open: pull anything outside the unlocked rows back in where it fits
    for (let i = S.invSize; i < SLOTS; i++) { const s = S.inv[i]; if (s) { S.inv[i] = null; addItem(s.id, s.n, false); } }
  }
  // fills matching stacks first, then empty slots; returns how many did not fit
  function addItem(id, n, save = true) {
    let left = n;
    for (let i = 0; i < S.invSize && left; i++) {
      const s = S.inv[i];
      if (s && s.id === id && s.n < MAX_STACK) { const k = Math.min(left, MAX_STACK - s.n); s.n += k; left -= k; }
    }
    for (let i = 0; i < S.invSize && left; i++) {
      if (!S.inv[i]) { const k = Math.min(left, MAX_STACK); S.inv[i] = { id, n: k }; left -= k; }
    }
    if (save && left < n) { touch(); if (tab === 'inv') renderInv(); }
    return left;
  }
  const countItem = id => S.inv.reduce((t, s, i) => t + (s && s.id === id && i < S.invSize ? s.n : 0), 0);
  // how many more of an item fit in the unlocked slots
  const roomFor = id => S.inv.reduce((t, s, i) => i >= S.invSize ? t : t + (!s ? MAX_STACK : s.id === id ? MAX_STACK - s.n : 0), 0);
  // takes from the smallest stacks first so big stacks stay together
  function removeItem(id, n) {
    const slots = S.inv.map((s, i) => [s, i]).filter(([s, i]) => s && s.id === id && i < S.invSize).sort((a, b) => a[0].n - b[0].n);
    for (const [s, i] of slots) {
      if (!n) break;
      const k = Math.min(n, s.n);
      s.n -= k; n -= k;
      if (!s.n) { S.inv[i] = null; if (sel === i) sel = -1; }
    }
    if (tab === 'inv') renderInv();
  }
  // drop a onto b: move into an empty slot, merge the same item up to 99, otherwise swap
  function moveSlot(a, b) {
    const A = S.inv[a], B = S.inv[b];
    if (!A || a === b) return;
    if (!B) { S.inv[b] = A; S.inv[a] = null; }
    else if (B.id === A.id) {
      const k = Math.min(A.n, MAX_STACK - B.n);
      B.n += k; A.n -= k;
      if (!A.n) S.inv[a] = null;
      else if (!k) { S.inv[a] = B; S.inv[b] = A; }
    } else { S.inv[a] = B; S.inv[b] = A; }
    touch();
  }
  function sortInv() {
    const totals = {};
    for (const s of S.inv) if (s) totals[s.id] = (totals[s.id] || 0) + s.n;
    S.inv = Array(SLOTS).fill(null);
    for (const id of Object.keys(ITEMS)) if (totals[id]) addItem(id, totals[id], false);
    sel = -1; touch(); renderInv();
  }

  let sel = -1, suppressClick = false;
  const grid = document.getElementById('invGrid');
  function buildGrid() {
    for (let i = 0; i < SLOTS; i++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'slot'; b.dataset.i = i;
      b.addEventListener('click', () => onSlot(i));
      b.addEventListener('pointerdown', e => startDrag(e, i));
      grid.appendChild(b);
    }
  }
  function renderInv() {
    if (!grid.children.length) buildGrid();
    let used = 0;
    for (let i = 0; i < SLOTS; i++) {
      const s = S.inv[i], b = grid.children[i];
      b.hidden = i >= S.invSize;
      if (b.hidden) continue;
      const key = s ? s.id + ':' + s.n : '';
      if (b.dataset.key !== key) {
        b.dataset.key = key;
        b.innerHTML = s ? ITEMS[s.id].icon + `<span class="q">${s.n}</span>` : '';
        b.classList.toggle('full', !!s && s.n >= MAX_STACK);
      }
      const row = Math.floor(i / ROW) + 1, col = i % ROW + 1;
      b.setAttribute('aria-label', s ? `${ITEMS[s.id].name}, ${s.n}, row ${row}, column ${col}` : `Empty slot, row ${row}, column ${col}`);
      b.classList.toggle('sel', i === sel);
      if (s) used++;
    }
    document.getElementById('invCount').textContent = `${used} of ${S.invSize} slots used`;
    grid.setAttribute('aria-label', `Inventory, ${plural(S.invSize / ROW, 'row', 'rows')} of ${ROW}`);
    const more = document.getElementById('moreRoom');
    if (S.invSize < SLOTS) {
      more.innerHTML = 'Need more room? <button type="button" id="goShop">Buy another row in the Shop</button>.';
      document.getElementById('goShop').addEventListener('click', () => setTab('shop'));
    } else more.textContent = 'All 10 rows are unlocked.';
    renderSide();
  }
  function renderSide() {
    const side = document.getElementById('invSide');
    const s = sel >= 0 ? S.inv[sel] : null;
    if (!s) {
      sel = -1;
      side.innerHTML = `<h2>No item selected</h2>
        <p class="hint">Tap an item to see its details. Then tap another slot to move it, stack it or swap places. On a computer you can also drag.</p>
        <p class="hint">Each slot holds one kind of item, up to ${MAX_STACK}. You start with one row of ${ROW} slots.</p>`;
      return;
    }
    const it = ITEMS[s.id];
    const hasEmpty = S.inv.some((x, k) => !x && k < S.invSize);
    side.innerHTML = `<div class="big">${it.icon}</div>
      <h2>${esc(it.name)}</h2>
      <p class="qty">${s.n} / ${MAX_STACK}</p>
      <p class="fact">${esc(it.desc)}</p>
      <div class="row">
        ${s.n > 1 && hasEmpty ? '<button class="ghost" id="invSplit" type="button">Split stack</button>' : ''}
        <button class="ghost" id="invDrop" type="button">Discard 1</button>
      </div>`;
    const split = document.getElementById('invSplit');
    if (split) split.addEventListener('click', () => {
      const cur = S.inv[sel]; if (!cur || cur.n < 2) return;
      const j = S.inv.findIndex((x, k) => !x && k < S.invSize); if (j < 0) return;
      const half = Math.floor(cur.n / 2);
      cur.n -= half; S.inv[j] = { id: cur.id, n: half };
      touch(); renderInv();
    });
    document.getElementById('invDrop').addEventListener('click', () => {
      const cur = S.inv[sel]; if (!cur) return;
      cur.n -= 1; if (!cur.n) { S.inv[sel] = null; sel = -1; }
      touch(); renderInv();
    });
  }
  function onSlot(i) {
    if (suppressClick) return;
    if (sel < 0) { if (S.inv[i]) sel = i; }
    else if (sel === i) sel = -1;
    else { moveSlot(sel, i); sel = S.inv[i] ? i : -1; }
    renderInv();
  }

  // mouse drag; touch uses tap-to-select, tap-to-place
  let drag = null;
  function startDrag(e, i) {
    if (e.pointerType !== 'mouse' || e.button !== 0 || !S.inv[i]) return;
    drag = { from: i, x: e.clientX, y: e.clientY, ghost: null, over: null };
  }
  window.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.ghost) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      drag.ghost = document.createElement('div');
      drag.ghost.className = 'drag-ghost';
      drag.ghost.innerHTML = ITEMS[S.inv[drag.from].id].icon;
      document.body.appendChild(drag.ghost);
    }
    drag.ghost.style.left = e.clientX + 'px';
    drag.ghost.style.top = e.clientY + 'px';
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const slot = t && t.closest ? t.closest('.slot') : null;
    if (drag.over !== slot) { if (drag.over) drag.over.classList.remove('over'); drag.over = slot; if (slot) slot.classList.add('over'); }
  });
  window.addEventListener('pointerup', () => {
    if (!drag) return;
    if (drag.ghost) {
      drag.ghost.remove();
      if (drag.over) {
        drag.over.classList.remove('over');
        const to = +drag.over.dataset.i;
        if (to !== drag.from) { moveSlot(drag.from, to); sel = S.inv[to] ? to : -1; }
      }
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
      renderInv();
    }
    drag = null;
  });
  document.getElementById('invSort').addEventListener('click', sortInv);

  // ---------- coins + shop ----------
  const FEED_COINS = 5;
  const HATCH_COINS = { proto: 10, hypa: 25, raptor: 60, rex: 150 };
  // food costs less than a meal pays (+5), so feeding always comes out ahead
  const FOOD_PACKS = [{ id: 'leaf', qty: 5, price: 10 }, { id: 'meat', qty: 5, price: 15 }];
  const ROW_PRICE = 50;   // 1st extra row 50, 2nd 100, 3rd 150 ... 9th 450
  const rowPrice = () => ROW_PRICE * ((S.invSize - BASE_SLOTS) / ROW + 1);
  const BAG = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11 10 C11 4 21 4 21 10" stroke="#6d4e2a" stroke-width="2.6" fill="none"/><rect x="5" y="9" width="22" height="20" rx="6" fill="#9c7240"/><rect x="9.5" y="17" width="13" height="9" rx="2.5" fill="#c49a5c"/><rect x="14" y="15.5" width="4" height="3.4" rx="1" fill="#6d4e2a"/></svg>';

  function renderCoins(bump) {
    document.getElementById('coinsVal').textContent = S.coins || 0;
    if (bump) { const c = document.querySelector('.coins'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
  }
  function addCoins(n) { S.coins = (S.coins || 0) + n; renderCoins(true); if (tab === 'shop') renderShop(); }

  let shopMsg = '';
  function renderShop() {
    const box = document.getElementById('shopBox');
    const maxed = S.invSize >= SLOTS, price = rowPrice(), can = S.coins >= price;
    const rows = S.invSize / ROW;
    box.innerHTML = `
      <article class="shop-item">
        <div class="shop-icon">${BAG}</div>
        <div class="shop-body">
          <h3>Bigger backpack</h3>
          <p class="hint">Adds a row of ${ROW} slots to your inventory.</p>
          <div class="rows-meter" aria-hidden="true">${Array.from({ length: SLOTS / ROW }, (_, i) => `<i class="${i < rows ? 'on' : ''}"></i>`).join('')}</div>
          <p class="hint">${S.invSize} of ${SLOTS} slots unlocked</p>
        </div>
        <div class="shop-buy">
          ${maxed ? '<p class="qty">Inventory maxed out</p>'
            : `<button class="btn" id="buyRow" type="button" ${can ? '' : 'disabled'}>Buy for ${price} coins</button>
               <p class="hint">${can ? 'You will have ' + (S.invSize + ROW) + ' slots' : (price - S.coins) + ' more coins needed'}</p>`}
        </div>
      </article>
      ${FOOD_PACKS.map((p, k) => {
        const it = ITEMS[p.id], have = countItem(p.id), fits = roomFor(p.id) >= p.qty, ok = S.coins >= p.price && fits;
        return `<article class="shop-item">
          <div class="shop-icon">${it.icon}</div>
          <div class="shop-body">
            <h3>${p.qty} ${it.plural}</h3>
            <p class="hint">${esc(it.desc)}</p>
            <p class="hint">You have ${have}</p>
          </div>
          <div class="shop-buy">
            <button class="btn" type="button" data-pack="${k}" ${ok ? '' : 'disabled'}>Buy for ${p.price} coins</button>
            <p class="hint">${!fits ? "Won't fit in your inventory" : S.coins < p.price ? (p.price - S.coins) + ' more coins needed' : 'Goes to your inventory'}</p>
          </div>
        </article>`;
      }).join('')}
      ${shopMsg ? `<p class="hint" role="status">${esc(shopMsg)}</p>` : ''}
      <div class="earn">
        <h3>How to earn coins</h3>
        <ul>
          <li>Feed a hungry baby: +${FEED_COINS} (uses 1 leaf or 1 meat from your inventory)</li>
          <li>Hatch an egg: +${HATCH_COINS.proto} (Common), +${HATCH_COINS.hypa} (Uncommon), +${HATCH_COINS.raptor} (Rare), +${HATCH_COINS.rex} (Legendary)</li>
        </ul>
      </div>`;
    box.querySelectorAll('[data-pack]').forEach(b => b.addEventListener('click', () => {
      const p = FOOD_PACKS[+b.dataset.pack];
      if (S.coins < p.price || roomFor(p.id) < p.qty) return;
      S.coins -= p.price;
      addItem(p.id, p.qty, false);
      shopMsg = `Bought! +${p.qty} ${ITEMS[p.id].plural} in your inventory.`;
      touch(); renderCoins(true); renderShop(); checkHunger();
    }));
    const buy = document.getElementById('buyRow');
    if (buy) buy.addEventListener('click', () => {
      const p = rowPrice();
      if (S.invSize >= SLOTS || S.coins < p) return;
      S.coins -= p; S.invSize += ROW;
      shopMsg = `Bought! Your inventory now has ${S.invSize} slots.`;
      touch(); renderCoins(true); renderShop();
    });
  }

  // ---------- tabs ----------
  const TABS = { incubator: ['tabInc', 'panelInc'], nest: ['tabNest', 'panelNest'], inv: ['tabInv', 'panelInv'], shop: ['tabShop', 'panelShop'] };
  let tab = 'incubator';
  try { const t = localStorage.getItem(LS + ':tab') || localStorage.getItem(LEGACY_LS + ':tab'); if (TABS[t]) tab = t; } catch (e) {}
  function setTab(next) {
    tab = TABS[next] ? next : 'incubator';
    try { localStorage.setItem(LS + ':tab', tab); } catch (e) {}
    for (const [k, [t, p]] of Object.entries(TABS)) {
      document.getElementById(t).setAttribute('aria-selected', String(k === tab));
      document.getElementById(p).hidden = k !== tab;
    }
    if (tab === 'nest') for (const w of walkers.values()) w.x = Math.min(w.x, sceneW() - 70);
    if (tab === 'inv') renderInv();
    if (tab === 'shop') { shopMsg = ''; renderShop(); }
    runScene(tab === 'nest' && !document.hidden);
  }
  for (const k of Object.keys(TABS)) document.getElementById(TABS[k][0]).addEventListener('click', () => setTab(k));
  setInterval(checkHunger, 1000);

  document.addEventListener('visibilitychange', () => {
    runScene(tab === 'nest' && !document.hidden);
    if (!document.hidden) {
      checkHunger();
      if (S.current && !reveal) update();
    }
  });
  window.addEventListener('pagehide', () => { if (saveTimer) { clearTimeout(saveTimer); flush(); } });

  normalizeState();
  render();
  setTab(tab);
  connect();
})();
</script>
</body>
</html>
